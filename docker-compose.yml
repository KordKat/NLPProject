# STEM OS — local deployment
#   docker compose up -d --build        → http://localhost:8080
# Requires the NVIDIA Container Toolkit for GPU inference (remove the `deploy` block to run on CPU).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stemos}
      POSTGRES_DB: ${POSTGRES_DB:-stemos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stemos}"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:5.20-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-stemos-neo4j}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4jdata:/data
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 30

  sandbox:
    build: ./sandbox
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-change-me-sandbox-token}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-1024}
      WORKSPACES_ROOT: /workspaces
    volumes:
      - ./storage/projects:/workspaces
    networks: [sandbox_net]          # internal network: no internet access
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stemos}:${POSTGRES_PASSWORD:-stemos}@postgres:5432/${POSTGRES_DB:-stemos}
      NEO4J_URI: bolt://neo4j:7687
      FAISS_DIR: /data/faiss
      STORAGE_DIR: /storage
      SANDBOX_MODE: remote
      SANDBOX_URL: http://sandbox:8090
      HF_HOME: /models/hf
      SKILLS_DIR: /skills
    volumes:
      - ./test_out_st/test_out_st:/data/faiss:ro     # existing FAISS index (reused as-is)
      - ./skills:/skills:ro                         # built-in skill library (user skills live in /storage/skills)
      - ./storage:/storage                          # projects, artifacts, metadata sidecar
      - hfcache:/models/hf                          # KeawGPT + MiniLM weights
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      sandbox: { condition: service_started }
    networks: [default, sandbox_net]
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:8080"]

networks:
  default: {}
  sandbox_net:
    internal: true

volumes:
  pgdata:
  neo4jdata:
  hfcache:
